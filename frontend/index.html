<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>WebAR Card Scanner</title>
    <link rel="stylesheet" href="/src/css/style.css">
    <script type="importmap">
      {
        "imports": {
          "three": "/src/vendor/three.module.js",
          "three/addons/": "/src/vendor/three-addons/",
          "mindar-image-three": "/src/vendor/mindar-image-three.prod.js"
        }
      }
    </script>
  </head>
  <body>
    <main id="app">
      <div id="ar-root" aria-hidden="true"></div>

      <section id="ui-layer" aria-label="Scanner controls">
        <div id="status" role="status" aria-live="polite">Ready to scan</div>
        <div id="error-message" role="alert" hidden></div>
        <div id="camera-permission-popup" hidden>
          <div class="camera-popup-content">
            <p>Camera access is required for AR scanning.</p>
            <p>Please allow camera permission when prompted.</p>
            <div class="camera-popup-buttons">
              <button id="camera-allow" type="button">Allow Camera</button>
              <button id="camera-deny" type="button">Deny</button>
            </div>
          </div>
        </div>
        <div id="scan-guide" aria-hidden="true">
          <span></span>
          <span></span>
          <span></span>
          <span></span>
        </div>

        <div id="controls">
          <button id="start-ar" type="button">Start</button>
          <button id="mute-video" type="button" hidden>Mute</button>
          <button id="replay-video" type="button" hidden>Replay</button>
        </div>
      </section>
    </main>

    <script type="module" src="/src/js/app.js"></script>
  </body>
</html>
